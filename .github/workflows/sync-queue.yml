name: sync-queue
# 贴链接后即时同步：_queue.md 一变就跑（CF 后台写入队列即触发），也可手动 dispatch
on:
  push:
    paths: ["_queue.md"]
  workflow_dispatch:

concurrency:
  group: sync-queue
  cancel-in-progress: false

permissions:
  contents: write
  actions: write  # 允许本工作流推送后触发 deploy.yml

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configure git
        run: |
          git config user.name "vc-sync-bot"
          git config user.email "vc-sync-bot@users.noreply.github.com"
      - name: Consume queue and generate pages
        run: python scripts/sync_queue_action.py
      - name: Commit and push
        id: commit
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "sync: 队列自动同步 $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push origin main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      # 关键：本工作流用 GITHUB_TOKEN 推送不会触发 deploy.yml（GitHub 防循环机制），
      # 因此推送成功后必须显式 dispatch 一次，否则 GitHub Pages 会一直停在同步前版本。
      - name: Trigger GitHub Pages deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api repos/${{ github.repository }}/actions/workflows/deploy.yml/dispatches -f ref=main
