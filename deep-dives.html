<script>
(function () {
  function esc(s) {
    return (s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  fetch("posts.json").then(function (r) { return r.json(); }).then(function (d) {
    var deep = (d.posts || []).filter(function (p) { return p.section === "深度"; });
    if (!deep.length) return;
    document.getElementById("dive-list").innerHTML = deep.map(function (p, i) {
      return '<a class="dive" href="' + esc(p.file) + '">' +
        '<div class="no">' + String(i + 1).padStart(2, "0") + '</div>' +
        '<div><h3>' + esc(p.title) + '</h3><p>' + esc(p.desc) + '</p>' +
        '<div class="len">' + esc(p.date) + (p.mins ? " · 约 " + esc(p.mins) + " 分钟" : "") + '</div></div></a>';
    }).join("");
  }).catch(function () {});
})();
</script>
